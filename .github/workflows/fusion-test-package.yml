name: Fusion Xbox test installer

on:
  workflow_dispatch:
  push:
    branches: [feature/zelda-fusion-isolation]
    paths:
      - '.github/workflows/fusion-test-package.yml'
      - 'tools/fusion_package_*.py'
      - 'tools/test_fusion_package.py'
      - 'tools/uwp_startup_selection_test.cpp'
      - 'tools/uwp_boot_diagnostics_host/**'
      - 'tools/ci/fusion_boot_diagnostics.ps1'
      - 'tools/ci/fusion_xbox_package.ps1'
      - 'uwp/**'

permissions:
  contents: read
  actions: read

concurrency:
  group: fusion-test-package-${{ github.ref }}
  cancel-in-progress: true

env:
  ASSET_SOURCE: 3c4559d3a934cbb3598a4ab2c03122c3be1a5ffa
  UWP_DEP_COMMIT: f5dbd58ee06a4b439bf260d641585dbc8bef3b86

jobs:
  contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 tools/test_uwp_package_contract.py
      - run: python3 tools/test_fusion_package.py

  diagnostics:
    needs: contracts
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python -m pip install pefile==2024.8.26
      - name: Exercise real faults and early logging across Store CRT DLLs
        shell: pwsh
        run: ./tools/ci/fusion_boot_diagnostics.ps1
      - name: Preserve native crash-report evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fusion-boot-diagnostic-tests-${{ github.run_id }}-${{ github.run_attempt }}
          path: scratch/boot-diagnostics-evidence/
          if-no-files-found: warn
          retention-days: 30

  oot-port:
    needs: contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Reuse the exact audited ROM-free OoT port archive
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONPATH: tools
        run: python3 -c 'from fusion_package_inputs import reuse_oot_port; reuse_oot_port()'
      - uses: actions/upload-artifact@v4
        with:
          name: INTERNAL-fusion-oot-port-${{ github.sha }}
          path: scratch/oot-port/
          if-no-files-found: error
          retention-days: 14

  package:
    needs: [contracts, oot-port, diagnostics]
    runs-on: windows-2022
    # A pinned full-core rebuild can still be running when the short wrapper
    # tests finish. Wait for that exact audited input before creating the MSIX.
    timeout-minutes: 110
    defaults:
      run:
        shell: pwsh
    env:
      UWP_VERSION: 1.0.${{ github.run_number }}.${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.ASSET_SOURCE }}
          path: scratch/engine-assets-source
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: SternXD/uwp-dep
          ref: ${{ env.UWP_DEP_COMMIT }}
          path: scratch/uwp-dep
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: INTERNAL-fusion-oot-port-${{ github.sha }}
          path: scratch/oot-port
      - name: Install PE inspection dependency
        run: python -m pip install pefile==2024.8.26
      - name: Verify exact native core artifacts and assemble payload
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/fusion_package_inputs.py
      - name: Build, sign and audit Fusion test installer
        run: ./tools/ci/fusion_xbox_package.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: ZELDA-FUSION-XBOX-${{ env.UWP_VERSION }}
          path: scratch/dist/ZELDA-FUSION-XBOX/
          if-no-files-found: error
          retention-days: 30
      - name: Preserve packaging evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fusion-package-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            scratch/fusion-package-diagnostics/
            scratch/fusion-package-inputs/BUILD.json
            scratch/fusion-package-audit.json
            scratch/build-fusion-package/*.vcxproj
          if-no-files-found: warn
          retention-days: 30
