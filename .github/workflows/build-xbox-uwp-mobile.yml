          git -C source apply "$RUNNER_TEMP/uwp-compiler-hotfix.patch"
          mkdir -p source/.github/workflows
          cp source/.source-workflow/build-xbox-uwp.yml \
            source/.github/workflows/build-xbox-uwp.yml
          (cd source && python3 tools/test_uwp_package_contract.py)

          git -C source add uwp/boot_diagnostics.cpp tools/test_uwp_package_contract.py
          git -C source diff --cached --check
          tree="$(git -C source write-tree)"
          updated="$(
            printf '%s\n' \
              'fix: use UWP-safe boot diagnostics APIs' \
              '' \
              'Replace the unavailable GetModuleHandleW call with direct LoadPackagedLibrary probing and use fopen_s for the durable boot log.' |
