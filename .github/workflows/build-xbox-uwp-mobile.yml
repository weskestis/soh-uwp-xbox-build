name: Build Xbox UWP package from mobile bundle

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xbox-uwp-${{ github.ref }}
  cancel-in-progress: true

env:
  SOURCE_BUNDLE: SOH-Source-a00a4d86.bundle
  SOURCE_BUNDLE_SHA256: 05a5aa2e95e2a606776e0b0b4ff1b16e3204544db3aa83873db5fe366ee754d3
  SOURCE_COMMIT: a00a4d86fc20882385b18c46594a45e07eac9c8b
  UWP_DEP_COMMIT: f5dbd58ee06a4b439bf260d641585dbc8bef3b86
  VCPKG_COMMIT: 9e593bb18ea69cc5095e012465dcd675a822ed0d
  ZAPDTR_BASE_COMMIT: 7d1bdbc4e582ef48c34b28d5cea9602040d0971e
  ZAPDTR_COMMIT: 5f37af814f4c558d20de3c21d5e336d8d1cc99bf
  ZAPDTR_BUNDLE_SHA256: f2be655739afe616fd56fb4ac88ee0f4309beb9d7da54fe5345e1d6dcdd1adb6
  CORE_RUNTIME_ARTIFACT: INTERNAL-windows-core-runtime
  PACKAGE_NAME: SOH-CURSOR-FPS-V3-OOT3D-FULL-XBOX
  PACKAGE_PUBLISHER: CN=SOHCursorFPSV3OoT3DFull

jobs:
  host-assets:
    name: Generate redistributable port archive
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        working-directory: source
    steps:
      - name: Check out mobile builder files
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: false
          persist-credentials: false

      - name: Reconstruct exact source
        working-directory: .
        run: |
          test -f "$GITHUB_WORKSPACE/$SOURCE_BUNDLE"
          echo "$SOURCE_BUNDLE_SHA256  $GITHUB_WORKSPACE/$SOURCE_BUNDLE" | sha256sum --check --strict
          git clone --filter=blob:none --no-checkout https://github.com/SomeoneIsWorking/zelda3d.git source
          git -C source fetch "$GITHUB_WORKSPACE/$SOURCE_BUNDLE" refs/heads/cursor-fps-v3-full-build
          git -C source checkout --detach FETCH_HEAD
          test "$(git -C source rev-parse HEAD)" = "$SOURCE_COMMIT"

      - name: Check out public build submodules
        run: |
          git submodule update --init --depth 1 Shipwright/libultraship/extern/StormLib
          git clone --depth 1 --branch zelda3d https://github.com/SomeoneIsWorking/ZAPDTR.git Shipwright/ZAPDTR
          mkdir -p scratch
          base64 --decode cmake/Zelda3DZAPDTR-5f37af8.bundle.b64 > scratch/ZAPDTR-5f37af8.bundle
          echo "$ZAPDTR_BUNDLE_SHA256  scratch/ZAPDTR-5f37af8.bundle" | sha256sum --check --strict
          test "$(git -C Shipwright/ZAPDTR rev-parse HEAD)" = "$ZAPDTR_BASE_COMMIT"
          git -C Shipwright/ZAPDTR fetch "$GITHUB_WORKSPACE/source/scratch/ZAPDTR-5f37af8.bundle" HEAD
          git -C Shipwright/ZAPDTR checkout --detach FETCH_HEAD
          test "$(git -C Shipwright/ZAPDTR rev-parse HEAD)" = "$ZAPDTR_COMMIT"

      - name: Install host build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build lsb-release zipcmp zipmerge ziptool \
            libsdl2-dev libsdl2-net-dev libpng-dev \
            libzip-dev nlohmann-json3-dev libtinyxml2-dev libspdlog-dev \
            libopengl-dev libopusfile-dev libvorbis-dev libfreetype6-dev

      - name: Configure host asset generator
        run: |
          cmake -S . -B scratch/build-host-assets -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DZELDA3D_SDL2_OPENGL=ON \
            -DZELDA3D_BUILD_MM=OFF \
            -DZELDA3D_BUILD_LAUNCHER=OFF \
            -DZELDA3D_ENABLE_ROM_EXTRACTION=ON \
            -DLUS_BUILD_TESTS=OFF

      - name: Generate and validate soh.o2r
        run: |
          cmake --build scratch/build-host-assets --target GenerateSohOtr --parallel 2
          test -s Shipwright/soh/soh.o2r
          unzip -t Shipwright/soh/soh.o2r

      - name: Transfer port archive to package job
        uses: actions/upload-artifact@v4
        with:
          name: INTERNAL-soh-port-archive
          path: source/Shipwright/soh/soh.o2r
          if-no-files-found: error
          overwrite: true
          compression-level: 0
          retention-days: 3

  windows-core:
    name: Compile and preserve Windows core DLL
    runs-on: windows-2022
    timeout-minutes: 180
    defaults:
      run:
        working-directory: source
    steps:
      - name: Check out mobile builder files
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: false
          persist-credentials: false

      - name: Reconstruct exact source
        shell: pwsh
        working-directory: .
        run: |
          $bundle = Join-Path $env:GITHUB_WORKSPACE $env:SOURCE_BUNDLE
          if (!(Test-Path $bundle -PathType Leaf)) { throw "Missing source bundle: $bundle" }
          $actualHash = (Get-FileHash $bundle -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne $env:SOURCE_BUNDLE_SHA256) { throw "Source bundle SHA-256 mismatch" }
          git clone --filter=blob:none --no-checkout https://github.com/SomeoneIsWorking/zelda3d.git source
          if ($LASTEXITCODE -ne 0) { throw "Upstream clone failed" }
          git -C source fetch $bundle refs/heads/cursor-fps-v3-full-build
          if ($LASTEXITCODE -ne 0) { throw "Source bundle import failed" }
          git -C source checkout --detach FETCH_HEAD
          if ($LASTEXITCODE -ne 0) { throw "Source checkout failed" }
          $actualCommit = (git -C source rev-parse HEAD).Trim()
          if ($actualCommit -ne $env:SOURCE_COMMIT) { throw "Source commit mismatch: $actualCommit" }

      - name: Check out pinned SDL2, libuwp, and Mesa depot
        uses: actions/checkout@v4
        with:
          repository: SternXD/uwp-dep
          ref: ${{ env.UWP_DEP_COMMIT }}
          path: source/scratch/uwp-dep
          fetch-depth: 1
          persist-credentials: false

      - name: Check out pinned vcpkg
        uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          ref: ${{ env.VCPKG_COMMIT }}
          path: source/scratch/vcpkg
          fetch-depth: 1
          persist-credentials: false

      - name: Bootstrap vcpkg
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE\source\scratch\vcpkg\bootstrap-vcpkg.bat" -disableMetrics
          if ($LASTEXITCODE -ne 0) { throw "vcpkg bootstrap failed" }

      - name: Install x64 static core libraries
        shell: pwsh
        run: |
          $vcpkg = "$env:GITHUB_WORKSPACE\source\scratch\vcpkg\vcpkg.exe"
          & $vcpkg install --triplet x64-windows-static `
            libzip nlohmann-json tinyxml2 spdlog freetype `
            libogg libvorbis opus opusfile zlib bzip2 glew
          if ($LASTEXITCODE -ne 0) { throw "vcpkg core dependency install failed" }

      - name: Configure Windows core DLL
        shell: pwsh
        run: |
          cmake -S . -B scratch/build-uwp-core -G "Visual Studio 17 2022" -A x64 `
            "-DCMAKE_SYSTEM_VERSION=10.0.19041.0" `
            -DCMAKE_TOOLCHAIN_FILE="$env:GITHUB_WORKSPACE\source\scratch\vcpkg\scripts\buildsystems\vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static `
            -DZELDA3D_UWP_CORE=ON `
            -DZELDA3D_UWP_DEPS_ROOT="$env:GITHUB_WORKSPACE\source\scratch\uwp-dep" `
            -DZELDA3D_SDL2_OPENGL=ON `
            -DZELDA3D_BUILD_MM=OFF `
            -DZELDA3D_BUILD_LAUNCHER=OFF `
            -DZELDA3D_ENABLE_ROM_EXTRACTION=OFF `
            -DNON_PORTABLE=ON `
            -DLUS_BUILD_TESTS=OFF
          if ($LASTEXITCODE -ne 0) { throw "Windows core configure failed" }

      - name: Compile Windows core DLL
        shell: pwsh
        run: |
          $coreLog = Join-Path $env:RUNNER_TEMP "windows-core-build.log"
          cmake --build scratch/build-uwp-core --config Release --target soh_core --parallel 2 2>&1 |
            Tee-Object -FilePath $coreLog
          $coreExit = $LASTEXITCODE
          if ($coreExit -ne 0) { exit $coreExit }

      - name: Stage exact Windows core output
        shell: pwsh
        run: |
          python tools/uwp_runtime_stage.py stage-core `
            --source-root . `
            --stage-dir scratch/windows-core-runtime `
            --archive scratch/windows-core-runtime.zip
          if ($LASTEXITCODE -ne 0) { throw "Windows core runtime staging failed" }

      - name: Preserve Windows core for package retries
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.CORE_RUNTIME_ARTIFACT }}
          path: source/scratch/windows-core-runtime.zip
          if-no-files-found: error
          overwrite: true
          compression-level: 0
          retention-days: 3

      - name: Publish core build diagnostics
        if: failure()
        shell: pwsh
        working-directory: .
        run: |
          $log = Join-Path $env:RUNNER_TEMP "windows-core-build.log"
          if (!(Test-Path $log)) {
            Write-Output "::warning title=Windows core diagnostic::The failure happened outside the captured compiler/linker log."
            exit 0
          }
          $diagnostics = Get-Content $log |
            Where-Object {
              $_ -match '(?i)(fatal error|:\s*error\s+(C|LNK|MSB)\d+|\berror\s+LNK\d+|\bLNK\d{4}\b|CMake Error)'
            } |
            ForEach-Object { $_.Trim() } |
            Select-Object -Unique -First 20
          if (@($diagnostics).Count -eq 0) {
            Write-Output "::warning title=Windows core diagnostic::No compiler or linker diagnostic was found in the captured build log."
          }
          foreach ($diagnostic in $diagnostics) {
            $safe = $diagnostic.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Windows core diagnostic::$safe"
          }

  windows-package:
    name: Build, audit, and sign UWP x64 package
    needs: [host-assets, windows-core]
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        working-directory: source
    steps:
      - name: Check out mobile builder files
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: false
          persist-credentials: false

      - name: Reconstruct exact source
        shell: pwsh
        working-directory: .
        run: |
          $bundle = Join-Path $env:GITHUB_WORKSPACE $env:SOURCE_BUNDLE
          if (!(Test-Path $bundle -PathType Leaf)) { throw "Missing source bundle: $bundle" }
          $actualHash = (Get-FileHash $bundle -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne $env:SOURCE_BUNDLE_SHA256) { throw "Source bundle SHA-256 mismatch" }
          git clone --filter=blob:none --no-checkout https://github.com/SomeoneIsWorking/zelda3d.git source
          if ($LASTEXITCODE -ne 0) { throw "Upstream clone failed" }
          git -C source fetch $bundle refs/heads/cursor-fps-v3-full-build
          if ($LASTEXITCODE -ne 0) { throw "Source bundle import failed" }
          git -C source checkout --detach FETCH_HEAD
          if ($LASTEXITCODE -ne 0) { throw "Source checkout failed" }
          $actualCommit = (git -C source rev-parse HEAD).Trim()
          if ($actualCommit -ne $env:SOURCE_COMMIT) { throw "Source commit mismatch: $actualCommit" }

      - name: Check out pinned SDL2, libuwp, and Mesa depot
        uses: actions/checkout@v4
        with:
          repository: SternXD/uwp-dep
          ref: ${{ env.UWP_DEP_COMMIT }}
          path: source/scratch/uwp-dep
          fetch-depth: 1
          persist-credentials: false

      - name: Download preserved Windows core
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.CORE_RUNTIME_ARTIFACT }}
          path: source/scratch/core-artifact

      - name: Download redistributable port archive
        uses: actions/download-artifact@v4
        with:
          name: INTERNAL-soh-port-archive
          path: source/scratch/host-assets

      - name: Assemble and validate wrapper runtime
        shell: pwsh
        run: |
          python tools/uwp_runtime_stage.py assemble `
            --archive scratch/core-artifact/windows-core-runtime.zip `
            --port-archive scratch/host-assets/soh.o2r `
            --deps-root scratch/uwp-dep `
            --runtime-dir scratch/uwp-runtime
          if ($LASTEXITCODE -ne 0) { throw "UWP wrapper runtime assembly failed" }

      - name: Configure ROM-free UWP wrapper
        shell: pwsh
        run: |
          cmake -S uwp -B scratch/build-uwp-wrapper -G "Visual Studio 17 2022" -A x64 `
            -DZELDA3D_UWP_RUNTIME_DIR="$env:GITHUB_WORKSPACE\source\scratch\uwp-runtime" `
            -DZELDA3D_UWP_DEPS_ROOT="$env:GITHUB_WORKSPACE\source\scratch\uwp-dep" `
            -DZELDA3D_UWP_ALLOW_INCOMPLETE_RENDERER=ON `
            -DZELDA3D_UWP_REQUIRE_SIGNING=OFF `
            -DZELDA3D_UWP_VERSION="1.0.${{ github.run_number }}.${{ github.run_attempt }}"
          if ($LASTEXITCODE -ne 0) { throw "UWP wrapper configure failed" }

      - name: Build unsigned AppX
        shell: pwsh
        run: |
          $wrapperLog = Join-Path $env:RUNNER_TEMP "uwp-wrapper-build.log"
          cmake --build scratch/build-uwp-wrapper --config Release --target zelda3d-uwp --parallel 2 -- `
            /p:GenerateAppxPackageOnBuild=true `
            /p:AppxPackageSigningEnabled=false `
            /p:UapAppxPackageBuildMode=SideloadOnly `
            /p:AppxBundle=Never 2>&1 | Tee-Object -FilePath $wrapperLog
          $wrapperExit = $LASTEXITCODE
          if ($wrapperExit -ne 0) { exit $wrapperExit }

      - name: Sign, audit, and assemble Device Portal artifact
        shell: pwsh
        run: |
          $wrapper = "$env:GITHUB_WORKSPACE\source\scratch\build-uwp-wrapper"
          $dist = "$env:GITHUB_WORKSPACE\source\scratch\dist\$env:PACKAGE_NAME"
          New-Item -ItemType Directory -Force "$dist\Dependencies" | Out-Null

          $allCandidates = @(Get-ChildItem $wrapper -Recurse -File -Filter *.appx |
            Where-Object { $_.FullName -notmatch '\\Dependencies\\' })
          $candidates = @($allCandidates | Where-Object { $_.FullName -match '\\AppPackages\\' } |
            Sort-Object Length -Descending)
          if ($candidates.Count -eq 0) {
            $candidates = @($allCandidates | Sort-Object Length -Descending)
          }
          if ($candidates.Count -eq 0) { throw "Visual Studio produced no AppX" }
          $appx = "$dist\SOH-CURSOR-FPS-V3-OOT3D-FULL-x64.appx"
          Copy-Item $candidates[0].FullName $appx

          Get-ChildItem $wrapper -Recurse -File -Filter *.appx |
            Where-Object { $_.FullName -match '\\Dependencies\\' } |
            ForEach-Object { Copy-Item $_.FullName "$dist\Dependencies" -Force }

          $sdkRoots = @(Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Directory |
            Where-Object { $_.Name -match '^\d+\.\d+\.\d+\.\d+$' } |
            Sort-Object { [version]$_.Name } -Descending)
          $sdkBin = $sdkRoots | Where-Object {
            (Test-Path (Join-Path $_.FullName "x64\signtool.exe")) -and
            (Test-Path (Join-Path $_.FullName "x64\makeappx.exe"))
          } | Select-Object -First 1
          if ($null -eq $sdkBin) { throw "Windows SDK AppX tools are missing" }
          $signTool = Join-Path $sdkBin.FullName "x64\signtool.exe"
          $makeAppx = Join-Path $sdkBin.FullName "x64\makeappx.exe"

          $pfx = "$env:GITHUB_WORKSPACE\source\scratch\ephemeral-signing.pfx"
          $cer = "$dist\SOH-CURSOR-FPS-V3-OOT3D-FULL.cer"
          $passwordText = [guid]::NewGuid().ToString("N")
          $password = ConvertTo-SecureString $passwordText -AsPlainText -Force
          $cert = $null
          try {
            $cert = New-SelfSignedCertificate `
              -Type Custom `
              -Subject $env:PACKAGE_PUBLISHER `
              -KeyAlgorithm RSA `
              -KeyLength 2048 `
              -HashAlgorithm SHA256 `
              -KeyUsage DigitalSignature `
              -KeyExportPolicy Exportable `
              -CertStoreLocation Cert:\CurrentUser\My `
              -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3")
            Export-PfxCertificate -Cert $cert -FilePath $pfx -Password $password | Out-Null
            Export-Certificate -Cert $cert -FilePath $cer -Type CERT | Out-Null

            & $signTool sign /fd SHA256 /f $pfx /p $passwordText $appx
            if ($LASTEXITCODE -ne 0) { throw "SignTool failed" }
            Import-Certificate -FilePath $cer -CertStoreLocation Cert:\CurrentUser\TrustedPeople | Out-Null
            & $signTool verify /pa /v $appx
            if ($LASTEXITCODE -ne 0) { throw "Signed AppX verification failed" }
            foreach ($dependencyAppx in Get-ChildItem "$dist\Dependencies" -File -Filter *.appx) {
              & $signTool verify /pa /v $dependencyAppx.FullName
              if ($LASTEXITCODE -ne 0) {
                throw "Dependency AppX signature verification failed: $($dependencyAppx.Name)"
              }
            }

            $unpacked = "$env:GITHUB_WORKSPACE\source\scratch\appx-audit"
            Remove-Item $unpacked -Recurse -Force -ErrorAction SilentlyContinue
            & $makeAppx unpack /p $appx /d $unpacked /o
            if ($LASTEXITCODE -ne 0) { throw "Could not audit packed AppX" }

            python tools/uwp_runtime_stage.py audit-appx `
              --unpacked-dir $unpacked `
              --publisher $env:PACKAGE_PUBLISHER
            if ($LASTEXITCODE -ne 0) { throw "Packed AppX runtime audit failed" }
          }
          finally {
            Remove-Item $pfx -Force -ErrorAction SilentlyContinue
            if ($null -ne $cert) {
              Remove-Item "Cert:\CurrentUser\My\$($cert.Thumbprint)" -Force -ErrorAction SilentlyContinue
              Remove-Item "Cert:\CurrentUser\TrustedPeople\$($cert.Thumbprint)" -Force -ErrorAction SilentlyContinue
            }
          }

          Copy-Item uwp\ANDROID-INSTALL.txt $dist
          Copy-Item uwp\PRIVATE-DATA-NOT-INCLUDED.txt $dist
          New-Item -ItemType Directory -Force "$dist\ThirdPartyNotices" | Out-Null
          if (Test-Path scratch\uwp-dep\lic) {
            Copy-Item scratch\uwp-dep\lic "$dist\ThirdPartyNotices\uwp-dep" -Recurse
          } elseif (Test-Path scratch\uwp-dep\License) {
            Copy-Item scratch\uwp-dep\License "$dist\ThirdPartyNotices\uwp-dep" -Recurse
          } elseif (Test-Path scratch\uwp-dep\LICENSE) {
            Copy-Item scratch\uwp-dep\LICENSE "$dist\ThirdPartyNotices\uwp-dep-LICENSE.txt"
          } else {
            throw "Pinned UWP dependency notices are missing"
          }

          if (Get-ChildItem $dist -Recurse -File -Include *.pfx,*.p12) {
            throw "A private signing key entered the Device Portal artifact"
          }
          Get-ChildItem $dist -Recurse -File | Where-Object { $_.Extension -in ".appx", ".cer" } |
            Sort-Object FullName |
            ForEach-Object {
              $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              $relative = [IO.Path]::GetRelativePath($dist, $_.FullName).Replace('\', '/')
              "$hash  $relative"
            } | Set-Content "$dist\SHA256SUMS.txt"
          $sourceCommit = (git rev-parse HEAD).Trim()
          "source_commit=$sourceCommit" | Set-Content "$dist\BUILD.txt"
          "workflow_commit=$env:GITHUB_SHA" | Add-Content "$dist\BUILD.txt"
          "workflow_run=${{ github.run_id }}" | Add-Content "$dist\BUILD.txt"
          "workflow_attempt=${{ github.run_attempt }}" | Add-Content "$dist\BUILD.txt"

      - name: Upload phone-ready Device Portal package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PACKAGE_NAME }}
          path: source/scratch/dist/${{ env.PACKAGE_NAME }}
          if-no-files-found: error
          overwrite: true
          compression-level: 0
          retention-days: 30

      - name: Publish wrapper build diagnostics
        if: failure()
        shell: pwsh
        working-directory: .
        run: |
          $log = Join-Path $env:RUNNER_TEMP "uwp-wrapper-build.log"
          if (!(Test-Path $log)) {
            Write-Output "::warning title=UWP package diagnostic::The failure happened before or after the captured wrapper build log."
            exit 0
          }
          $diagnostics = Get-Content $log |
            Where-Object {
              $_ -match '(?i)(fatal error|:\s*error\s+(C|LNK|MSB|APPX)\d+|\berror\s+LNK\d+|\bLNK\d{4}\b|CMake Error)'
            } |
            ForEach-Object { $_.Trim() } |
            Select-Object -Unique -First 20
          if (@($diagnostics).Count -eq 0) {
            Write-Output "::warning title=UWP package diagnostic::No compiler, linker, or AppX diagnostic was found in the captured wrapper log."
          }
          foreach ($diagnostic in $diagnostics) {
            $safe = $diagnostic.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=UWP package diagnostic::$safe"
          }
