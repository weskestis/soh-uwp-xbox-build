name: Fusion UWP runtime probe

on:
  workflow_dispatch:
  push:
    branches: [feature/zelda-fusion-isolation]
    paths:
      - '.github/workflows/fusion-uwp-runtime-probe.yml'
      - 'tools/uwp_runtime_probe/**'
      - 'tools/uwp_dependency_probe/**'
      - 'cmake/vcpkg-uwp-ports/**'
      - 'tools/uwp_store_build.py'
      - 'tools/uwp_core_imports.py'

permissions:
  contents: read

concurrency:
  group: fusion-runtime-probe-${{ github.ref }}
  cancel-in-progress: true

env:
  VCPKG_COMMIT: 9e593bb18ea69cc5095e012465dcd675a822ed0d

jobs:
  store-runtime:
    runs-on: windows-2022
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check out pinned Xbox dependency binaries
        uses: actions/checkout@v4
        with:
          repository: SternXD/uwp-dep
          ref: f5dbd58ee06a4b439bf260d641585dbc8bef3b86
          path: scratch/uwp-dep
          persist-credentials: false
      - name: Test runtime evidence rejection
        run: |
          New-Item -ItemType Directory -Force scratch | Out-Null
          python tools/uwp_runtime_probe/test_audit.py
          if ($LASTEXITCODE -ne 0) { throw "Runtime audit tests failed" }
      - name: Check out pinned vcpkg
        uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          ref: ${{ env.VCPKG_COMMIT }}
          path: scratch/vcpkg
          persist-credentials: false
      - name: Restore Store dependencies
        id: dependency-cache
        uses: actions/cache/restore@v4
        with:
          path: scratch/vcpkg-cache
          key: fusion-store-vcpkg-${{ runner.os }}-${{ env.VCPKG_COMMIT }}-${{ hashFiles('cmake/vcpkg-uwp-ports/**') }}
          restore-keys: |
            fusion-store-vcpkg-${{ runner.os }}-${{ env.VCPKG_COMMIT }}-
      - name: Build pinned Store FreeType with the production overlay
        run: |
          New-Item -ItemType Directory -Force scratch/runtime-probe-diagnostics,scratch/vcpkg-cache | Out-Null
          ./scratch/vcpkg/bootstrap-vcpkg.bat -disableMetrics
          if ($LASTEXITCODE -ne 0) { throw "vcpkg bootstrap failed" }
          ./scratch/vcpkg/vcpkg.exe install freetype:x64-uwp-static-md `
            "--overlay-ports=$env:GITHUB_WORKSPACE/cmake/vcpkg-uwp-ports" `
            "--binarysource=clear;files,$env:GITHUB_WORKSPACE/scratch/vcpkg-cache,readwrite" 2>&1 |
            Tee-Object scratch/runtime-probe-diagnostics/freetype-dependencies.log
          if ($LASTEXITCODE -ne 0) { throw "Store FreeType build failed" }
          Copy-Item scratch/vcpkg/installed/x64-uwp-static-md/include/freetype/config/ftoption.h `
            scratch/runtime-probe-diagnostics/freetype-options.h
      - name: Preserve the rebuilt dependency cache
        if: steps.dependency-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: scratch/vcpkg-cache
          key: ${{ steps.dependency-cache.outputs.cache-primary-key }}
      - name: Configure isolated normal-Windows DLL with Store runtime
        run: |
          New-Item -ItemType Directory -Force scratch/runtime-probe-diagnostics | Out-Null
          cmake -S tools/uwp_runtime_probe -B scratch/build-runtime-probe -G "Visual Studio 17 2022" -A "x64,version=10.0.19041.0" `
            -DCMAKE_SYSTEM_NAME=Windows -DCMAKE_SYSTEM_VERSION=10.0.19041.0 `
            "-DCMAKE_TOOLCHAIN_FILE=$env:GITHUB_WORKSPACE/scratch/vcpkg/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-uwp-static-md -DVCPKG_APPLOCAL_DEPS=OFF -DFUSION_PROBE_FREETYPE=ON 2>&1 |
            Tee-Object scratch/runtime-probe-diagnostics/configure.log
          if ($LASTEXITCODE -ne 0) { throw "Runtime probe configure failed" }
      - name: Build with verbose library selection
        run: |
          cmake --build scratch/build-runtime-probe --config Release --target fusion_uwp_runtime_probe -- /v:normal 2>&1 |
            Tee-Object scratch/runtime-probe-diagnostics/build.log
          if ($LASTEXITCODE -ne 0) { throw "Runtime probe build failed" }
      - name: Verify actual CRT imports and AppContainer flag
        run: |
          $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $dumpbin = Get-ChildItem "$vs/VC/Tools/MSVC/*/bin/Hostx64/x64/dumpbin.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1
          if ($null -eq $dumpbin) { throw "dumpbin missing" }
          $dll = "scratch/build-runtime-probe/Release/fusion_uwp_runtime_probe.dll"
          foreach ($kind in @("imports", "exports", "headers")) {
            & $dumpbin.FullName "/$kind" $dll | Set-Content "scratch/runtime-probe-diagnostics/$kind.txt"
            if ($LASTEXITCODE -ne 0) { throw "dumpbin $kind failed" }
          }
          python tools/uwp_runtime_probe/audit.py scratch/runtime-probe-diagnostics --freetype
          if ($LASTEXITCODE -ne 0) { throw "Store runtime selection not established" }
          Get-FileHash $dll -Algorithm SHA256 | Format-List | Out-String |
            Set-Content scratch/runtime-probe-diagnostics/SHA256.txt
          "source_commit=$env:GITHUB_SHA`nnot_a_game_build=true`nxbox_runtime_verified=false" |
            Set-Content scratch/runtime-probe-diagnostics/BUILD.txt
      - name: Collect bundled DLL and Store framework evidence
        run: ./tools/uwp_dependency_probe/collect.ps1
      - name: Preserve probe diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fusion-runtime-probe-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            scratch/runtime-probe-diagnostics/
            scratch/build-runtime-probe/fusion_uwp_runtime_probe.vcxproj
            scratch/build-runtime-probe/Release/fusion_uwp_runtime_probe.dll
            scratch/vcpkg/buildtrees/freetype/*.log
          if-no-files-found: error
          retention-days: 30
